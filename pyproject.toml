[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rppg-liveness-lab"
version = "0.1.0"
description = "Reproducible Python rPPG presentation-attack baseline and evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "opencv-python>=4.8,<5", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[project.scripts]
rppg = "rppg_liveness.cli:main"

[tool.setuptools.packages.find]
include = ["rppg_liveness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
